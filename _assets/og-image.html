<!DOCTYPE html>
<!--
  Source for /og-image.png (the 1200×630 social share card).
  Regenerate after editing (from the repo root):

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --hide-scrollbars --window-size=1200,630 --screenshot=og-image.png \
    "file://$PWD/_assets/og-image.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(800px 420px at 50% 40%, rgba(138,180,255,.13), transparent 70%),
      #0b0d12;
    color: #e8ebf2;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-size: 22px; letter-spacing: .24em; text-transform: uppercase;
    color: #8b93a7; margin-bottom: 36px;
  }
  .stage { position: relative; padding-bottom: 130px; }
  h1 {
    margin: 0; font-size: 92px; font-weight: 600; letter-spacing: -.03em;
    display: flex; gap: 0 .28em; white-space: nowrap;
  }
  .active { color: #8ab4ff; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  path { fill: none; stroke: #8ab4ff; stroke-linecap: round; }
  .domain { font-size: 24px; color: #8b93a7; margin-top: 24px; }
</style>
</head>
<body>
  <div class="eyebrow">Essays on AI</div>
  <div class="stage" id="stage">
    <svg id="arcs"></svg>
    <h1><span>All</span><span>you</span><span>need</span><span>is</span><span class="active">attention.</span></h1>
  </div>
  <div class="domain">allyouneedisattention.com</div>
<script>
  // Same drawing as the home page hero, frozen on "attention."
  const toks = [...document.querySelectorAll('h1 span')];
  const stage = document.getElementById('stage').getBoundingClientRect();
  const svg = document.getElementById('arcs');
  const w = [.35, .10, .30, .15, .10];
  const c = toks.map(t => { const r = t.getBoundingClientRect(); return { x: r.left + r.width / 2 - stage.left, y: r.bottom - stage.top + 10 }; });
  const a = c[4];
  w.forEach((wt, j) => {
    const b = c[j], p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    if (j === 4) {
      const r = 30 + wt * 100;
      p.setAttribute('d', `M${a.x - 16},${a.y} C${a.x - 40},${a.y + r} ${a.x + 40},${a.y + r} ${a.x + 16},${a.y}`);
    } else {
      const depth = Math.min(40 + Math.abs(b.x - a.x) * 0.1, 105);
      p.setAttribute('d', `M${a.x},${a.y} Q${(a.x + b.x) / 2},${a.y + depth * 2} ${b.x},${b.y}`);
    }
    p.style.strokeWidth = (2 + wt * 16).toFixed(1);
    p.style.opacity = Math.min(1, .12 + wt * 1.4).toFixed(2);
    svg.appendChild(p);
  });
</script>
</body>
</html>
